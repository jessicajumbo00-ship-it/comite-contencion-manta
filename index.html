
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MantaSafe | Comité de Contención</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #eef3f6;
      color: #183153;
    }
    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #18315312;
    }
    .tag {
      color: #176b53;
      font-weight: bold;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #176b53;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #resultado {
      margin-top: 18px;
      padding: 14px;
      background: #e6f4ed;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">COMITÉ DE CONTENCIÓN DE MANTA</p>
    <h1>MantaSafe</h1>
    <h2>Simulador de brotes epidemiológicos</h2>
    <p>
      Explora cómo las estrategias de contención y la distribución
      de recursos pueden influir en la evolución de un brote ficticio.
    </p>
    <button onclick="iniciar()">Probar aplicación</button>
    <div id="resultado" aria-live="polite">
      Sistema preparado. Pulsa el botón para comenzar.
    </div>
  </main>
  <script>
    function iniciar() {
      document.getElementById("resultado").textContent =
        "¡MantaSafe está funcionando! Próximamente: simulación SEIR, estrategias y gráficas.";
    }
  </script>
</body>
</html>
